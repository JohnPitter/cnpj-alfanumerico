name: Publish to Maven Central

on:
  release:
    types: [published]

jobs:
  publish:
    name: Publish to Maven Central
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version
        env:
          RELEASE_VERSION: ${{ github.event.release.tag_name }}
        run: mvn versions:set -DnewVersion="$RELEASE_VERSION" --batch-mode

      - name: Build & Test
        run: mvn clean verify --batch-mode --no-transfer-progress

      - name: List GPG keys
        run: gpg --list-secret-keys --keyid-format=long

      - name: Publish to Maven Central
        run: |
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format=long | grep 'sec' | head -1 | sed 's/.*\/\([A-F0-9]*\) .*/\1/')
          mvn deploy -P release -Dgpg.keyname="$GPG_KEY_ID" --batch-mode --no-transfer-progress
        env:
          MAVEN_USERNAME: ${{ secrets.OSSRH_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.OSSRH_TOKEN }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
